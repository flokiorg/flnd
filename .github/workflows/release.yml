name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 0.2.3, no "v" prefix). Leave blank to use
          the topmost "## [X.Y.Z]" heading in CHANGELOG.md.
        required: false
        type: string

permissions:
  contents: write

env:
  # Same tag set ci.yaml builds and tests with, so the gate below exercises
  # the same code CI does. Note GoReleaser builds the published binaries with
  # the release tag set from .goreleaser.yaml, which is a different (wider)
  # set -- that build is exercised here too, at the GoReleaser step.
  BUILD_TAGS: dev autopilotrpc chainrpc invoicesrpc neutrinorpc peersrpc routerrpc signrpc verrpc walletrpc watchtowerrpc wtclientrpc

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Same commands as ci.yaml. A release is never cut from a state that
      # would not also pass CI.
      - name: Build
        run: go build -tags="${{ env.BUILD_TAGS }}" ./...

      - name: Vet
        run: go vet -tags="${{ env.BUILD_TAGS }}" ./...

      - name: Test
        run: |
          # Same exclusions as ci.yaml: these packages need external
          # infrastructure this runner doesn't have and don't respect
          # `go test -short`.
          EXCLUDE_REGEX='/chainntnfs/bitcoindnotify$|/chainntnfs/test/btcd$|/chainntnfs/test/neutrino$|/lnwallet/test/neutrino$|/invoices$|/sqldb$|/routing/chainview$'
          PKGS=$(go list -tags="${{ env.BUILD_TAGS }}" ./... | grep -vE "$EXCLUDE_REGEX")
          go test -tags="${{ env.BUILD_TAGS }}" -timeout 20m $PKGS

      # No git event triggers a release on its own (workflow_dispatch only) and
      # GitHub never auto-generates the notes: they always come from
      # CHANGELOG.md, maintained by hand as part of normal development.
      - name: Resolve version and notes from CHANGELOG.md
        id: changelog
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            TOP_HEADING=$(grep -m1 -oP '^## \[\K[^\]]+' CHANGELOG.md || true)
            if [ "$TOP_HEADING" = "Unreleased" ]; then
              echo "::error::Topmost CHANGELOG.md heading is '## [Unreleased]' - rename it to the version being released (e.g. '## [0.2.3]') and commit that before running this workflow, or pass the version input explicitly"
              exit 1
            fi
            VERSION="$TOP_HEADING"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve a version: no version input given and no '## [X.Y.Z]' heading found in CHANGELOG.md"
            exit 1
          fi

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.raw

          # Trim leading/trailing blank lines.
          sed -e '/./,$!d' -e ':a' -e '/^\n*$/{$d;N;ba' -e '}' /tmp/notes.raw > /tmp/release-notes.md

          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::No changelog entry found for version $VERSION in CHANGELOG.md (heading missing or section is empty)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION with notes:"
          cat /tmp/release-notes.md

      # This repository is a fork and its upstream carries its own tags. The
      # workflow only ever fetches origin, so an upstream tag cannot be
      # reachable here -- but assert it anyway rather than discover a collision
      # by overwriting something.
      - name: Check the tag is free
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::notice::v$VERSION already exists on origin; it will be replaced by this run"
          fi

      - name: Tag release
        env:
          VERSION: ${{ steps.changelog.outputs.version }}
          ACTOR: ${{ github.actor }}
          ACTOR_EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_EMAIL"

          # Re-running a release (e.g. after a failed GoReleaser step) should
          # replace the existing tag rather than fail, both locally and on the
          # remote.
          git tag -d "v$VERSION" 2>/dev/null || true
          git push origin ":refs/tags/v$VERSION" 2>/dev/null || true

          # The tag's annotation is the same CHANGELOG.md section passed to
          # --release-notes below, so any tool that reads the tag message
          # instead still gets the real notes rather than a bare version string.
          git tag -a "v$VERSION" -F /tmp/release-notes.md
          git push origin "v$VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pinned to the major matching .goreleaser.yaml's `version: 2`, so a
          # future GoReleaser release cannot change --release-notes behaviour
          # out from under this workflow.
          version: "~> v2"
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
